<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg: oklch(0.975 0.003 30);
  --surface: oklch(1 0 0);
  --ink: oklch(0.25 0.015 30);
  --muted: oklch(0.48 0.02 30);
  --faint: oklch(0.62 0.015 30);
  --line: oklch(0.90 0.006 30);
  --accent: oklch(0.52 0.16 29);
  --accent-ink: oklch(0.40 0.14 29);
  --accent-tint: oklch(0.95 0.025 29);
  --amber-tint: oklch(0.95 0.045 85);  --amber-ink: oklch(0.44 0.11 70);
  --blue-tint: oklch(0.94 0.03 240);   --blue-ink: oklch(0.42 0.10 250);
  --green-tint: oklch(0.94 0.05 150);  --green-ink: oklch(0.40 0.11 150);
  --gray-tint: oklch(0.93 0.004 30);   --gray-ink: oklch(0.45 0.01 30);
  --radius: 8px;
}
*{ box-sizing:border-box; margin:0; padding:0 }
html{ -webkit-font-smoothing:antialiased }
body{
  font-family:'Archivo', ui-sans-serif, system-ui, sans-serif;
  background:var(--bg); color:var(--ink);
  font-size:15px; line-height:1.5;
  padding:0 clamp(16px, 4vw, 48px) 64px;
  max-width:1100px; margin:0 auto;
}

/* ---- top bar: wordmark + national sweep progress ---- */
header{
  display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
  padding:28px 0 20px; border-bottom:1px solid var(--line); flex-wrap:wrap;
}
.wordmark{ font-size:1.35rem; font-weight:700; letter-spacing:-0.015em }
.wordmark span{ color:var(--accent) }
.tagline{ color:var(--muted); font-size:.85rem; margin-top:2px }
.sweep{ text-align:right; min-width:220px; flex:0 1 300px }
.sweep .where{ font-size:.85rem; color:var(--muted) }
.sweep .where b{ color:var(--ink); font-weight:600 }
.sweep .track{
  margin-top:7px; height:4px; border-radius:2px; background:var(--line); overflow:hidden;
}
.sweep .fill{
  height:100%; width:0%; background:var(--accent); border-radius:2px;
  transition:width .4s cubic-bezier(.22,1,.36,1);
}
.sweep .count{ font-size:.75rem; color:var(--faint); margin-top:5px; font-variant-numeric:tabular-nums }

/* ---- the one control ---- */
.command{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  padding:24px 0 8px; font-size:1.05rem; font-weight:500;
}
.command input{
  width:76px; text-align:center;
  font:inherit; font-weight:700; font-variant-numeric:tabular-nums;
  color:var(--ink); background:var(--surface);
  border:1.5px solid var(--line); border-radius:var(--radius);
  padding:8px 4px; transition:border-color .15s ease;
}
.command input:hover{ border-color:var(--faint) }
.command input:focus{ outline:none; border-color:var(--accent) }
.command button{
  font:inherit; font-weight:600; cursor:pointer;
  color:oklch(0.99 0 0); background:var(--accent);
  border:none; border-radius:var(--radius);
  padding:10px 26px; margin-left:4px;
  transition:background .15s ease, transform .1s ease;
}
.command button:hover:not(:disabled){ background:oklch(0.46 0.16 29) }
.command button:active:not(:disabled){ transform:scale(.98) }
.command button:disabled{ background:var(--faint); cursor:default }
#scanmsg{
  min-height:22px; color:var(--muted); font-size:.85rem; padding:2px 0 14px;
  font-variant-numeric:tabular-nums;
}
#scanmsg.live::before{
  content:''; display:inline-block; width:7px; height:7px; border-radius:50%;
  background:var(--accent); margin-right:8px; vertical-align:1px;
  animation:pulse 1.2s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.25} }

/* ---- stat strip ---- */
.stats{
  display:flex; gap:0; border-top:1px solid var(--line); border-bottom:1px solid var(--line);
  margin-bottom:26px; font-variant-numeric:tabular-nums; overflow-x:auto;
}
.stat{ padding:12px 26px 12px 0; margin-right:26px; border-right:1px solid var(--line) }
.stat:last-child{ border-right:none }
.stat b{ font-size:1.25rem; font-weight:700 }
.stat span{ display:block; font-size:.75rem; color:var(--muted) }

/* ---- leads table ---- */
.tablewrap{ overflow-x:auto }
table{ width:100%; border-collapse:collapse; min-width:720px }
thead th{
  position:sticky; top:0; background:var(--bg);
  text-align:left; font-size:.72rem; font-weight:600; color:var(--faint);
  letter-spacing:.04em; text-transform:uppercase;
  padding:8px 14px 8px 0; border-bottom:1px solid var(--line);
}
tbody td{
  padding:13px 14px 13px 0; border-bottom:1px solid var(--line);
  vertical-align:middle; font-variant-numeric:tabular-nums;
}
tbody tr{ transition:background .15s ease }
tbody tr:hover{ background:var(--surface) }
tr.deadrow{ opacity:.45 }
tr.deadrow:hover{ opacity:.8 }
td.biz{ font-weight:600; max-width:260px }
td.biz small{ display:block; font-weight:400; color:var(--faint); font-size:.78rem }
.chip{
  display:inline-block; font-size:.78rem; color:var(--gray-ink);
  background:var(--gray-tint); border-radius:5px; padding:2px 9px; white-space:nowrap;
}
td.city{ color:var(--muted); font-size:.88rem; max-width:170px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
td.rev b{ font-weight:700 }
td.rev span{ color:var(--muted); font-size:.85rem }
td.phone{ font-size:.88rem; color:var(--muted); white-space:nowrap }
.pill{
  display:inline-block; cursor:pointer; user-select:none;
  font-size:.78rem; font-weight:600; border-radius:100px; padding:4px 13px;
  transition:filter .15s ease;
}
.pill:hover{ filter:brightness(.96) }
.s-new{ background:var(--accent-tint); color:var(--accent-ink) }
.s-texted{ background:var(--amber-tint); color:var(--amber-ink) }
.s-replied{ background:var(--blue-tint); color:var(--blue-ink) }
.s-sold{ background:var(--green-tint); color:var(--green-ink) }
.s-dead{ background:var(--gray-tint); color:var(--gray-ink) }
.buildbtn{
  font:inherit; font-size:.78rem; font-weight:600; cursor:pointer;
  color:var(--accent-ink); background:var(--accent-tint);
  border:1px solid transparent; border-radius:6px; padding:4px 11px;
  transition:border-color .15s ease; white-space:nowrap;
}
.buildbtn:hover{ border-color:var(--accent) }
.sitelink{ color:var(--accent-ink); font-weight:600; font-size:.85rem; text-decoration:none }
.sitelink:hover{ text-decoration:underline }
.maillink{ display:block; font-size:.8rem; color:var(--accent-ink); text-decoration:none; margin-top:2px; max-width:16ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.maillink:hover{ text-decoration:underline }
.mailadd{ display:block; cursor:pointer; font-size:.8rem; color:var(--faint); margin-top:2px }
.mailadd:hover{ color:var(--ink) }
.empty{
  padding:48px 0; text-align:center; color:var(--muted); font-size:.92rem;
}
.empty b{ color:var(--ink) }

@media (prefers-reduced-motion: reduce){
  *{ transition:none !important; animation:none !important }
}
</style>
</head>
<body>

<header>
  <div>
    <div class="wordmark">Lead<span>Finder</span></div>
    <div class="tagline">great reviews, no website. your next customers</div>
  </div>
  <div class="sweep">
    <div class="where">parked at <b id="roamnext">…</b></div>
    <div class="track"><div class="fill" id="roamfill"></div></div>
    <div class="count"><span id="roamdone">0</span> of <span id="roamtotal">937</span> US cities swept</div>
  </div>
</header>

<div class="command">
  Find <input id="count" type="number" value="5" min="1" max="50"> new businesses
  <button id="scanbtn" onclick="scan()">Scan</button>
</div>
<div id="scanmsg"></div>

<div class="stats">
  <div class="stat"><b id="n-total">0</b><span>leads</span></div>
  <div class="stat"><b id="n-contacted">0</b><span>contacted</span></div>
  <div class="stat"><b id="n-replied">0</b><span>replied</span></div>
  <div class="stat"><b id="n-sold">0</b><span>sold</span></div>
</div>

<div class="tablewrap">
<table>
  <thead><tr><th>Business</th><th>Niche</th><th>City</th><th>Reviews</th><th>Phone</th><th>Site</th><th>Status</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
</div>

<script>
const STATUSES = ['new','texted','replied','sold','dead'];
const RANK = { sold:0, replied:1, texted:2, new:3, dead:4 }; // pipeline importance, top to bottom

async function refresh(){
  const r = await fetch('/api/leads'); const d = await r.json();
  const leads = d.leads.sort((a,b)=>(RANK[a.status]??3)-(RANK[b.status]??3) || (b.rating*b.reviews)-(a.rating*a.reviews)); // closest to money first; best score within each group
  const msg = document.getElementById('scanmsg');
  msg.textContent = d.scan.running ? d.scan.message : (d.scan.message==='idle' ? '' : d.scan.message);
  msg.classList.toggle('live', !!d.scan.running);
  document.getElementById('scanbtn').disabled = !!d.scan.running;
  document.getElementById('scanbtn').textContent = d.scan.running ? 'Scanning…' : 'Scan';
  document.getElementById('n-total').textContent = leads.filter(l=>l.status!=='dead').length;
  document.getElementById('n-contacted').textContent = leads.filter(l=>['texted','replied','sold'].includes(l.status)).length;
  document.getElementById('n-replied').textContent = leads.filter(l=>['replied','sold'].includes(l.status)).length;
  document.getElementById('n-sold').textContent = leads.filter(l=>l.status==='sold').length;
  const tb = document.getElementById('rows');
  if(!leads.length){
    tb.innerHTML = '<tr><td colspan="7" class="empty">No leads yet. <b>Pick a number and hit Scan.</b> The machine sweeps US cities until it finds that many businesses worth pitching.</td></tr>';
  } else {
    tb.innerHTML = leads.map(l=>`<tr class="${l.status==='dead'?'deadrow':''}">
      <td class="biz">${esc(l.name)}</td>
      <td><span class="chip">${esc(l.niche||'')}</span></td>
      <td class="city" title="${esc(l.city||'')}">${esc(l.city||'')}</td>
      <td class="rev"><b>${l.reviews}</b> <span>· ${l.rating}★</span></td>
      <td class="phone">${esc(l.phone||'—')}${l.email
        ? `<a class="maillink" title="${esc(l.email)}" href="mailto:${esc(l.email)}?subject=${encodeURIComponent('A website for '+l.name)}&body=${encodeURIComponent('Hi — I built a website for '+l.name+'. Want a look?')}">✉ ${esc(l.email)}</a>`
        : `<span class="mailadd" onclick="setEmail('${l.id}','${esc(l.name).replace(/'/g,"\\'")}')">+ email</span>`}</td>
      <td>${l.site
        ? `<a class="sitelink" href="${l.custom?'/money/':'/sites/'}${l.site}/" target="_blank">view ↗</a>`
        : `<button class="buildbtn" onclick="build('${l.id}',this)">🔨 build</button>`}</td>
      <td><span class="pill s-${l.status}" onclick="cycle('${l.id}','${l.status}')">${l.status}</span></td>
    </tr>`).join('');
  }
  if(d.scan.running) setTimeout(()=>{refresh();roamInfo();}, 3000);
  else roamInfo();
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
async function roamInfo(){
  try{
    const r = await fetch('/api/roam'); const d = await r.json();
    document.getElementById('roamnext').textContent = (d.next || 'country swept') + (d.midCity ? ' (mid-city)' : '');
    document.getElementById('roamdone').textContent = d.cursor;
    document.getElementById('roamtotal').textContent = d.total;
    document.getElementById('roamfill').style.width = (100*d.cursor/Math.max(1,d.total)).toFixed(1) + '%';
  }catch{}
}
async function scan(){
  const count = parseInt(document.getElementById('count').value, 10) || 5;
  const msg = document.getElementById('scanmsg');
  msg.textContent = 'starting: hunting the next ' + count + ' business' + (count>1?'es':'') + '…';
  msg.classList.add('live');
  await fetch('/api/roam',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({count})});
  setTimeout(refresh, 1500);
}
async function build(id, el){
  el.textContent = '…'; el.style.pointerEvents = 'none';
  try{
    await fetch('/api/build',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id})});
  }catch{}
  refresh();
}
async function setEmail(id, name){
  const email = prompt('email for ' + name + ':');
  if(email === null) return;
  await fetch('/api/email',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,email})});
  refresh();
}
async function cycle(id,cur){
  const next = STATUSES[(STATUSES.indexOf(cur)+1)%STATUSES.length];
  await fetch('/api/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,status:next})});
  refresh();
}
refresh();
</script>
</body>
</html>
